# cpplint configuration for PowerTuneDigitalOfficial
# All C++ source files are in the project root (flat layout).
# build/include_subdir: cannot add directory prefixes for root-level headers.
# The whitespace/* categories below are disabled because this is a large,
# long-lived legacy codebase written before consistent spacing conventions
# were adopted; enabling them surfaces ~1000 pre-existing style-only findings
# on any file the linter touches, unrelated to the change being reviewed.
filter=-build/include_subdir,-build/include_order,-whitespace/comments,-whitespace/blank_line,-whitespace/parens,-whitespace/tab,-whitespace/operators,-whitespace/comma,-whitespace/newline,-whitespace/indent,-whitespace/semicolon,-whitespace/end_of_line
